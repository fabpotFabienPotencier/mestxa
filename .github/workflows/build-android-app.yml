name: Build Android APK (Cloud CI)

on:
  workflow_dispatch:
  push:
    branches: [ main, release ]
    paths:
      - 'mobile/android/**'
      - 'engine/**'
      - '.github/workflows/build-android-app.yml'
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    name: Build Native Mestxa Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK (r26b)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configure Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Dependencies Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Compile Native Rust Core (libmestxa.so)
        working-directory: engine
        run: |
          mkdir -p ../mobile/android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../mobile/android/app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-read-only: false

      - name: Build Android APK (Debug & Release)
        working-directory: mobile/android
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mestxa-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mestxa-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
