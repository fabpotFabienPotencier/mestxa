name: Cross-Compile Mestxa Native Mobile Core (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, release ]
    paths:
      - 'engine/**'
      - '.github/workflows/build-mobile-core.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'engine/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  audit-core:
    name: Audit Cryptographic Engine Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run Security Audit
        working-directory: engine
        continue-on-error: true
        run: cargo audit

  build-android:
    name: Build Android NDK Binaries (.so)
    needs: audit-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r26b)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Compile Android ABIs
        working-directory: engine
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../mobile/android/app/src/main/jniLibs build --release

      - name: Upload Android Native Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmestxa-android-jnilibs
          path: mobile/android/app/src/main/jniLibs
          if-no-files-found: warn

  build-ios:
    name: Build iOS Universal Framework (XCFramework)
    needs: audit-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Compile iOS Targets
        working-directory: engine
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim

      - name: Upload iOS Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmestxa-ios-binaries
          path: |
            engine/target/aarch64-apple-ios/release/libmestxa.a
            engine/target/aarch64-apple-ios-sim/release/libmestxa.a
          if-no-files-found: warn
