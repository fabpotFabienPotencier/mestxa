[package]
name = "mestxa-relay"
version = "0.1.0"
edition = "2021"
authors = ["Mestxa Core Team <core@mestxa.com>"]
description = "Bare-metal high-concurrency zero-knowledge store-and-forward relay for Mestxa"
publish = false

[dependencies]
# Async Runtime & HTTP/WebSocket
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Protocol Buffers Wire Format
prost = "0.13"
prost-types = "0.13"

# In-Memory Ephemeral Storage (Unix Domain Socket & TCP)
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Crypto & Blind Tokens Verification
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
sha2 = "0.10"
rand = "0.8"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
futures-util = "0.3"
hex = "0.4"

# Structured Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
