<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Messaging app prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #000;
      --tx: #fff;
      --s2: #8A8A8A;
      --sf: #1C1C1C;
      --sh: #121212;
      --ol: #3A3A3A;
      --me: #fff;
      --metx: #000;
      --th: #1C1C1C;
      --ac: var(--tx);
      --acx: var(--bg);
      --sfa: var(--sf);
      --acl: var(--tx);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme=light] {
      --bg: #fff;
      --tx: #000;
      --s2: #6B6B6B;
      --sf: #F2F2F2;
      --sh: #fff;
      --ol: #D9D9D9;
      --me: #000;
      --metx: #fff;
      --th: #F2F2F2
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: Inter, system-ui, sans-serif;
      color: var(--tx);
      -webkit-tap-highlight-color: transparent
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    #phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 880px;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden
    }

    @media(min-width:500px) {
      #phone {
        margin-top: max(0px, calc((100% - 880px)/2));
        border: 1px solid var(--ol);
        border-radius: 36px
      }
    }

    .scr {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: transform .25s ease-out
    }

    .scr {
      isolation: isolate
    }

    #cv {
      z-index: 5
    }

    .scr.push {
      transform: translateX(100%)
    }

    .scr.push.on {
      transform: none
    }

    .hd {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      flex: none
    }

    .hd h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      flex: 1;
      letter-spacing: -.02em
    }

    .hd h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      flex: 1
    }

    .cv .hd {
      border-bottom: 1px solid var(--ol);
      padding-left: 8px
    }

    .pg {
      flex: 1;
      overflow: auto;
      position: relative
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer
    }

    .ib {
      flex: none;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%
    }

    .ib:active,
    .row:active {
      background: var(--sf)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 76px;
      padding: 0 16px;
      width: 100%;
      text-align: left
    }

    .av {
      border-radius: 50%;
      background: #2a2a2a;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 15px;
      flex: none
    }

    .sq {
      border-radius: 14px
    }

    .mid {
      flex: 1;
      min-width: 0
    }

    .sub .t {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0
    }

    #main .pg {
      padding-bottom: 96px
    }

    .nm {
      font-size: 17px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sub {
      font-size: 15px;
      color: var(--s2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      gap: 4px;
      align-items: center
    }

    .el {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .rt {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      font-size: 13px;
      color: var(--s2);
      align-self: stretch;
      justify-content: center
    }

    .rt.u {
      color: var(--acl)
    }

    .bdg {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--ac);
      color: var(--acx);
      font-size: 12px;
      font-weight: 600;
      display: grid;
      place-items: center;
      padding: 0 5px
    }

    .pills {
      display: flex;
      gap: 6px;
      padding: 0 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: none
    }

    .pills::-webkit-scrollbar {
      display: none
    }

    .pl {
      flex: none;
      height: 30px;
      padding: 0 12px;
      white-space: nowrap;
      border-radius: 15px;
      border: 1px solid var(--ol);
      font-size: 13px;
      color: var(--s2)
    }

    .pl.pc {
      width: 30px;
      padding: 0;
      display: grid;
      place-items: center
    }

    .pl.a {
      background: var(--sfa);
      color: var(--acl);
      border-color: var(--sfa)
    }

    .fab {
      position: absolute;
      right: 16px;
      bottom: 96px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--ac);
      color: var(--acx);
      display: grid;
      place-items: center;
      transition: transform .15s
    }

    .fab:active {
      transform: scale(.94)
    }

    .tb {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80px;
      background: var(--bg);
      border-top: 1px solid var(--ol);
      display: flex;
      padding-top: 10px
    }

    .tb button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--s2)
    }

    .tb i {
      width: 64px;
      height: 32px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      transition: background .2s
    }

    .tb .a {
      color: var(--acl);
      font-weight: 700
    }

    .tb .a i {
      background: var(--sfa)
    }

    .menu {
      position: absolute;
      top: 56px;
      right: 12px;
      background: var(--sh);
      border: 1px solid var(--ol);
      border-radius: 16px;
      padding: 6px;
      z-index: 9;
      transform-origin: top right;
      animation: pop .15s ease-out;
      box-shadow: 0 8px 30px #0006
    }

    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 10px;
      min-width: 180px
    }

    .menu button:active {
      background: var(--sf)
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: 0
      }
    }

    .msgs {
      padding: 12px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .day {
      align-self: center;
      background: var(--sf);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 12px;
      margin: 4px 0 8px
    }

    .b {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.35;
      animation: in .2s ease-out
    }

    .b span {
      float: right;
      margin: 6px 0 -2px 12px;
      font-size: 11px;
      display: inline-flex;
      gap: 3px;
      align-items: center;
      opacity: .6
    }

    .b.me {
      align-self: flex-end;
      background: var(--ac);
      color: var(--acx)
    }

    .b.th {
      align-self: flex-start;
      background: var(--sfa)
    }

    .b.f {
      margin-top: 8px
    }

    .b.me.f {
      border-top-right-radius: 3px
    }

    .b.th.f {
      border-top-left-radius: 3px
    }

    @keyframes in {
      from {
        transform: translateY(8px);
        opacity: 0
      }
    }

    .bar {
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 8px 12px 12px;
      flex: none
    }

    .in {
      flex: 1;
      min-width: 0;
      height: 52px;
      border-radius: 26px;
      background: var(--sfa);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px 0 12px;
      color: var(--s2)
    }

    .in input {
      flex: 1;
      width: 0;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 16px;
      color: var(--tx)
    }

    .snd {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ac);
      color: var(--acx);
      display: grid;
      place-items: center;
      flex: none
    }

    .dim {
      position: absolute;
      inset: 0;
      background: #000a;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 7
    }

    .dim.on {
      opacity: 1;
      pointer-events: auto
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--sh);
      border-radius: 28px 28px 0 0;
      border: 1px solid var(--ol);
      border-bottom: 0;
      transform: translateY(105%);
      transition: transform .25s ease-out;
      z-index: 8;
      overflow: hidden
    }

    .sheet.on {
      transform: none
    }

    .hdl {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--s2);
      margin: 10px auto 18px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 8px;
      padding: 0 12px 20px;
      text-align: center
    }

    .grid button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--s2)
    }

    .grid i {
      width: 64px;
      height: 32px;
      border-radius: 16px;
      border: 1px solid var(--ol);
      display: grid;
      place-items: center;
      color: var(--acl);
      background: var(--bg)
    }

    .ph {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      height: 92px
    }

    .ph div {
      height: 100%
    }

    .ring {
      padding: 3px;
      border: 2px solid var(--acl);
      border-radius: 50%;
      display: flex
    }

    .ring.s {
      border-color: var(--ol)
    }

    .lab {
      font-size: 13px;
      color: var(--s2);
      padding: 12px 16px 4px
    }

    .tg {
      width: 48px;
      height: 28px;
      border-radius: 14px;
      background: var(--ol);
      position: relative;
      transition: background .2s;
      flex: none
    }

    .tg:after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--tx);
      transition: transform .2s
    }

    .tg.on {
      background: var(--ac)
    }

    .tg.on:after {
      transform: translateX(20px);
      background: var(--acx)
    }

    .set {
      height: 64px
    }

    .big {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 20px
    }

    .sc {
      display: flex;
      gap: 8px;
      padding: 8px 16px 16px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .sc::-webkit-scrollbar {
      display: none
    }

    .sk {
      flex: none;
      width: 76px;
      height: 135px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      background: var(--sf);
      border: 1px solid var(--ol);
      text-align: left
    }

    .sk:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 45%, #000b)
    }

    .sk .ring {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px;
      z-index: 1
    }

    .sk .n2 {
      position: absolute;
      left: 8px;
      right: 6px;
      bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.15;
      color: #fff;
      z-index: 1
    }

    .sk.ad {
      background: var(--sfa)
    }

    .sk.ad:after {
      display: none
    }

    .sk.ad .n2 {
      left: 0;
      right: 0;
      text-align: center;
      color: var(--tx)
    }

    .pb {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ac);
      color: var(--acx);
      display: grid;
      place-items: center;
      border: 2px solid var(--sfa)
    }

    .sec {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 4px;
      font-size: 22px;
      font-weight: 700
    }

    .ex {
      height: 44px;
      border-radius: 22px;
      background: var(--sfa);
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500
    }

    .fab2 {
      position: absolute;
      right: 24px;
      bottom: 166px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--sfa);
      border: 1px solid var(--ol);
      display: grid;
      place-items: center;
      color: var(--acl)
    }

    .qa {
      display: flex;
      gap: 16px;
      padding: 8px 16px 12px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .qa::-webkit-scrollbar {
      display: none
    }

    .qa button {
      flex: none;
      width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--s2)
    }

    .qa i {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--sfa);
      display: grid;
      place-items: center;
      color: var(--acl)
    }

    .seg {
      display: flex;
      gap: 4px;
      padding: 12px 12px 0;
      flex: none
    }

    .seg i {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: #ffffff40;
      overflow: hidden
    }

    .seg b {
      display: block;
      height: 100%;
      background: #fff;
      width: 0
    }

    .seg .d b {
      width: 100%
    }

    .seg .c b {
      animation: fill 5s linear forwards
    }

    @keyframes fill {
      to {
        width: 100%
      }
    }

    .cap {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      color: #fff
    }

    .tz {
      position: absolute;
      top: 76px;
      bottom: 84px;
      width: 40%;
      z-index: 2
    }

    .ta {
      width: 100%;
      height: 100%;
      background: none;
      border: 0;
      outline: 0;
      resize: none;
      color: var(--tx);
      font: 600 26px/1.25 Inter, sans-serif;
      text-align: center;
      padding: 30% 32px 0
    }

    .ta::placeholder {
      color: var(--s2)
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px 0;
      padding: 16px 16px 40px;
      justify-items: center
    }

    .cc {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: transform .15s
    }

    .cc:active {
      transform: scale(.92)
    }

    .cc.on {
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--tx)
    }

    .cc i {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      display: grid;
      place-items: center
    }

    .ch {
      flex: none;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-radius: 18px;
      background: var(--sfa);
      font-size: 14px;
      color: var(--tx)
    }

    .ch.a {
      background: var(--ac);
      color: var(--acx)
    }

    .ibx {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--sfa);
      color: var(--acl);
      display: grid;
      place-items: center;
      flex: none
    }

    .nt * {
      transition: none !important
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal
    }

    ::view-transition-old(root) {
      z-index: 1
    }

    ::view-transition-new(root) {
      z-index: 2
    }

    #main {
      overflow: hidden
    }

    #trk {
      display: flex;
      width: 400%;
      height: 100%;
      will-change: transform
    }

    .pane {
      width: 25%;
      height: 100%;
      flex: none;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden
    }

    .pane .pg,
    .pane .hd {
      touch-action: pan-y
    }

    .pills,
    .sc,
    .qa {
      touch-action: pan-x pan-y
    }

    .tb {
      z-index: 3
    }

    html,
    body {
      overscroll-behavior: none
    }

    #splash {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      color: var(--tx);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity .4s ease
    }

    #splash.out {
      opacity: 0;
      pointer-events: none
    }

    #splash .lg {
      animation: lg .6s cubic-bezier(.22, 1, .36, 1) both
    }

    @keyframes lg {
      from {
        opacity: 0;
        transform: scale(.9)
      }
    }

    #splash .fr {
      position: absolute;
      bottom: 56px;
      left: 0;
      right: 0;
      text-align: center;
      animation: fr .6s .3s ease both
    }

    @keyframes fr {
      from {
        opacity: 0
      }
    }

    #splash small {
      display: block;
      font-size: 14px;
      color: var(--s2);
      margin-bottom: 4px
    }

    #splash b {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.01em
    }

    #nc,
    #cm {
      z-index: 4
    }

    #ci {
      z-index: 6
    }

    #cl {
      z-index: 20
    }

    .cb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #1c1c1c;
      color: #fff;
      display: grid;
      place-items: center;
      transition: background .15s
    }

    .cb.on {
      background: #fff;
      color: #000
    }

    .b {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none
    }

    .b:has(.rx) {
      margin-bottom: 10px
    }

    .rx {
      position: absolute;
      bottom: -12px;
      left: 8px;
      background: var(--sh);
      color: var(--tx);
      border: 1px solid var(--ol);
      border-radius: 10px;
      padding: 0 5px;
      font-size: 12px;
      font-style: normal;
      line-height: 18px
    }

    .qt {
      border-left: 3px solid currentColor;
      padding: 2px 8px;
      margin-bottom: 4px;
      opacity: .7;
      font-size: 13px
    }

    .cd {
      width: 210px;
      max-width: 100%
    }

    .dots i {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin: 0 2px;
      animation: dt 1s infinite
    }

    .dots i:nth-child(2) {
      animation-delay: .15s
    }

    .dots i:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes dt {
      50% {
        transform: translateY(-4px);
        opacity: .4
      }
    }

    #gn,
    #sbs,
    #kp {
      z-index: 5
    }

    .ck {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--ol);
      display: grid;
      place-items: center;
      flex: none
    }

    .ck.on {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--acx)
    }

    .key {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--sf);
      font-size: 26px;
      font-weight: 500;
      display: grid;
      place-items: center
    }

    .key:active {
      background: var(--ol)
    }

    #mys,
    #chn,
    #scc,
    #arc {
      z-index: 5
    }

    #mld {
      z-index: 6
    }

    #gn {
      z-index: 9
    }

    #sed {
      z-index: 6
